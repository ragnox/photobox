name: Release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app-dir: mac-arm64
          - runner: macos-15-intel
            arch: x64
            app-dir: mac
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PHOTOBOX_REQUIRE_SIGNING: ${{ secrets.MAC_CERTIFICATE_P12 != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!==`v${p.version}`) throw Error("Tag and package version differ")'
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac -- --${{ matrix.arch }}
      - run: npm run test:desktop -- --app dist/${{ matrix.app-dir }}/Photobox.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
  draft:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: macos-*
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/checksums.js artifacts/*/*.dmg
      - run: gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "Photobox $RELEASE_TAG" artifacts/*/*.dmg SHA256SUMS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
