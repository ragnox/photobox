name: Checks
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - run: npm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :api:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: photobox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - run: npm run dist:mac -- --arm64
      - run: npm run test:desktop -- --app dist/mac-arm64/Photobox.app
      - uses: actions/upload-artifact@v4
        with:
          name: photobox-macos-arm64
          path: dist/*.dmg
